name: DNS Management CI

on:
  push:
    branches:
      - main
      - feature/github-actions

  pull_request:
    branches:
      - main

jobs:
  frontend-build:
    name: Frontend Build Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: domain-and-dns-management-system/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

  backend-validation:
    name: Backend Dependency Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: domain-and-dns-management-system/backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: npm ci